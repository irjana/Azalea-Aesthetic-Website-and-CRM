<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lead Capture Chat</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --accent: #79128e;
    --accent-light: #eaf0fb;
    --text: #1f2933;
    --muted: #6b7280;
    --bubble-user: #2f5496;
    --bubble-bot: #eef1f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .chat-card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    height: 600px;
    overflow: hidden;
  }
  .chat-header {
    background: var(--accent);
    color: white;
    padding: 16px 20px;
    font-weight: 600;
    font-size: 16px;
  }
  .chat-header small {
    display: block;
    font-weight: 400;
    font-size: 12px;
    opacity: 0.85;
    margin-top: 2px;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble.system-note {
    align-self: center;
    background: #fff3cd;
    color: #7a5b00;
    font-size: 13px;
    text-align: center;
  }
  .bubble.lead-saved {
    align-self: center;
    background: #e6f4ea;
    color: #1e6b34;
    font-size: 13px;
    border: 1px solid #b7e1c2;
    max-width: 95%;
  }
  .lead-saved strong { display: block; margin-bottom: 4px; }
  .input-row {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #e5e7eb;
  }
  .input-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
  }
  .input-row input:disabled {
    background: #f3f4f6;
  }
  .input-row button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  .input-row button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }
  .typing {
    align-self: flex-start;
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
    padding: 0 4px;
  }
  .lang-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.25);
    background: var(--accent);
  }
  .lang-row label {
    color: white;
    font-size: 12px;
    opacity: 0.9;
  }
  .lang-row select {
    font-size: 13px;
    padding: 4px 8px;
    border-radius: 6px;
    border: none;
  }
  .lang-row select:disabled {
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="chat-card">
  <div class="chat-header">
    Chat with us
  </div>
  <div class="lang-row">
    <label for="languageSelect">Language:</label>
    <select id="languageSelect">
      <option value="English" selected>English</option>
      <option value="Italian">Italiano</option>
    </select>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-row">
    <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  // Point this at your running FastAPI backend.
  const API_URL = "http://127.0.0.1:8000/chat";

  // The bot opens the conversation. This greeting is only shown in the UI and
  // added to the message history sent to the backend, so Claude has context
  // that it already spoke first. IMPORTANT: this must ask about the same
  // thing the system prompt expects to be asked first (need/reason for
  // visiting) - if these two disagree, the conversation starts off-order and
  // later logic (like topic guardrails anchored to the "need" answer) can
  // misfire. Keep this in sync with SYSTEM_PROMPT_TEMPLATE in main.py.
  const GREETINGS = {
    English: "Welcome to Azalea Aesthetics! How can we help you today?",
    Italian: "Benvenuto a Azalea Aesthetics! Come possiamo aiutarti?",
  };
  const CLOSING_MESSAGES = {
    English: "Thanks! Someone from our team will be in touch soon.",
    Italian: "Grazie! Qualcuno del nostro team ti contattera presto.",
  };

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const languageSelect = document.getElementById("languageSelect");

  let selectedLanguage = languageSelect.value;
  let conversation = [{ role: "assistant", content: GREETINGS[selectedLanguage] }];
  let conversationEnded = false;
  let conversationStarted = false; // becomes true once the user sends a first message

  function renderBubble(role, text) {
    const div = document.createElement("div");
    div.className = "bubble " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function renderLeadSaved(lead) {
    const div = document.createElement("div");
    div.className = "bubble lead-saved";
    div.innerHTML =
      "<strong>Lead captured</strong>" +
      "Name: " + escapeHtml(lead.name || "-") + "<br>" +
      "Contact: " + escapeHtml(lead.contact || "-") + "<br>" +
      "Need: " + escapeHtml(lead.need || "-") + "<br>" +
      "Timeline: " + escapeHtml(lead.timeline || "-");
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typingIndicator";
    div.textContent = "Typing...";
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById("typingIndicator");
    if (el) el.remove();
  }

  function setInputEnabled(enabled) {
    inputEl.disabled = !enabled;
    sendBtn.disabled = !enabled;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || conversationEnded) return;

    if (!conversationStarted) {
      conversationStarted = true;
      languageSelect.disabled = true; // lock the language choice once the conversation begins
    }

    renderBubble("user", text);
    conversation.push({ role: "user", content: text });
    inputEl.value = "";
    setInputEnabled(false);
    showTyping();

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ messages: conversation, language: selectedLanguage }),
      });

      hideTyping();

      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        renderBubble(
          "system-note",
          "Something went wrong talking to the assistant (" +
            res.status +
            "). " +
            (errBody.detail || "Check that the backend server is running.")
        );
        setInputEnabled(true);
        return;
      }

      const data = await res.json();

      if (data.status === "lead_saved") {
        renderLeadSaved(data.lead);
        renderBubble("assistant", CLOSING_MESSAGES[selectedLanguage]);
        conversationEnded = true;
        setInputEnabled(false);
        inputEl.placeholder = "Conversation complete";
      } else {
        renderBubble("assistant", data.reply);
        conversation.push({ role: "assistant", content: data.reply });
        setInputEnabled(true);
        inputEl.focus();
      }
    } catch (err) {
      hideTyping();
      renderBubble(
        "system-note",
        "Could not reach the backend at " + API_URL + ". Is uvicorn running?"
      );
      setInputEnabled(true);
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  // Switching language before the conversation starts re-renders the greeting
  // in the new language. Once conversationStarted is true, the dropdown is
  // disabled (see sendMessage) so this branch won't fire mid-conversation.
  languageSelect.addEventListener("change", () => {
    if (conversationStarted) return;
    selectedLanguage = languageSelect.value;
    messagesEl.innerHTML = "";
    conversation = [{ role: "assistant", content: GREETINGS[selectedLanguage] }];
    renderBubble("assistant", GREETINGS[selectedLanguage]);
  });

  // Show the bot's opening line immediately.
  renderBubble("assistant", GREETINGS[selectedLanguage]);
</script>

</body>
</html>
